services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: pathguard
      POSTGRES_USER: pathguard
      POSTGRES_PASSWORD: pathguard
    ports:
      - "5432:5432"
    volumes:
      - pathguard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathguard -d pathguard"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pathguard-postgres-data:
