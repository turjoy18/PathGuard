<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PathGuard – accessible emergency navigation</title>
  <meta name="description" content="Accessible emergency navigation for Hong Kong during typhoons, rainstorms and flooding. Demo build.">
  <meta name="theme-color" content="#0b5d4b">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <div id="sim-banner" class="sim-banner" role="status"></div>
  <header class="top">
    <a class="brand" href="#/"><img class="logo" src="/icon.svg" alt="" width="28" height="28"> PathGuard</a>
    <nav class="main" id="nav" aria-label="Main"></nav>
    <span class="spacer"></span>
    <div class="row" id="header-tools"></div>
  </header>
  <div id="alert-slot" class="alert-banner"></div>
  <main id="main" tabindex="-1"></main>
  <div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>
  <div id="toasts"></div>
  <div id="help-slot"></div>
  <noscript><p style="padding:1rem">PathGuard needs JavaScript. In an emergency call 999.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
